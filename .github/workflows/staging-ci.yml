name: Staging CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Render gate backend bằng `autoDeployTrigger: checksPass`, nên tên job phải giữ
  # đúng "Backend tests" như check đã đăng ký trên repo cũ.
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B clean test

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  deploy-repo-status:
    name: Report to deploy repo
    needs: backend-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish backend result on deploy-staging
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = { owner: 'PNV-do-an', repo: 'AI-Interview-Platform-deploy-staging' };
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'dev' });
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: branch.sha,
              state: '${{ needs.backend-test.result }}' === 'success' ? 'success' : 'failure',
              context: 'backend / staging',
              description: `${{ github.repository }}@${{ github.sha }}`,
              target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
            });
