<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile User</title>
</head>
<body>
    <h2>User Profile</h2>
    <p id="error" style="color:red"></p>

    <p><strong>Email:</strong> <span id="email"></span></p>
    <p><strong>Full Name:</strong> <span id="fullName"></span></p>
    <p><strong>Phone:</strong> <span id="phone"></span></p>
    <p><strong>Role:</strong> <span id="role"></span></p>
    <p><strong>Failed Login Count:</strong> <span id="counterFail"></span></p>

    <button onclick="logout()">Logout</button>

</body>

<script src="/js/apiClients.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/profile.js"></script>

<script>
    async function provideInformation() {

        try {
            const data = await getProfile();

            document.getElementById("email").innerText = data.email;
            document.getElementById("fullName").innerText = data.fullName;
            document.getElementById("phone").innerText = data.phone;
            document.getElementById("role").innerText = data.role;
            document.getElementById("counterFail").innerText = data.counterFail;
        }
        catch (error) {
            console.error(error)
            document.getElementById("error").innerText = error.message;
        }
    }
    provideInformation();

    function logout() {
        TOKEN_STORE.clearTokens();
        window.location.href = "/indexLogin.html";
    }
</script>
</html>
