<!DOCTYPE html>
    <html>
<head>
    <title>Login JWT</title>
</head>
<body>

<h2>Login</h2>

<input id="account" placeholder="Account"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>

<h3>Token:</h3>
<p id="accessToken"></p>
<p id="refreshToken"></p>

<h3>Call API:</h3>
<button onclick="callApi()">Call API</button>
<p id="result"></p>

<script>

    function login() {

        const account = document.getElementById("account").value;
        const password = document.getElementById("password").value;

        fetch("/api/auth/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                account: account,
                password: password
            })

        })

            .then(res => res.json())
            .then(data => {

                const accessToken = data.accessToken;
                const refreshToken = data.refreshToken;

                localStorage.setItem("accessToken", accessToken);
                localStorage.setItem("refreshToken", refreshToken);

                document.getElementById("accessToken").innerText = accessToken;
                document.getElementById("refreshToken").innerText = refreshToken;

            });
            window.location.href = localStorage.get("redirectAfterLogin")

    }

    function callApi() {
    // gửi để token mỗi lần để có thể xác minh ( mỗi requset với mỗi chức năng )
        fetch("/api/test", {

            method: "GET",

            headers: {
                "Authorization":
                    "Bearer " + localStorage.getItem("accessToken")
            }

        })
            .then( async res => {

                if (res.status === 401) {

                    localStorage.setItem("redirectAfterLogin",window.location.pathname)

                    await refreshAccessToken(); // if refreshToken expired  -> call to refreshAccessToken -> it will call to login -> user login
                                                // -> after that user will back to home page not feature page how to when user completed login
                                                // will back this feature.

                    return callApi();
                }

                return res.text();

            })
            .then(data => {

                document.getElementById("result").innerText = data;

            });

    }

    async function refreshAccessToken() {

        const refreshToken = localStorage.getItem("refreshToken");

        const response = fetch("/api/refresh", {
            method : "POST",

            headers :  {
                "Content-Type" : "application/json"
            },

            body: JSON.stringify({
                refreshToken: refreshToken
            })
        })

        // const data = await response.json(); // <- tại sao như này mà ko phải
            .then(res => {
                if(res.status === 401) { //
                    document.getElementById("result").innerText = "Refresh Token is expired" // ví dụ lỗi 401 -> refreshToken : hết hạn đăng nhập lại
                    return login(); // tôi băn khoăn là nên gọi function hay lúc khác sẽ là trả về path
                }
            })

        .then( res => res.json()) // <- nhưng ko phải như này

        .then(data => {

            localStorage.setItem("accessToken", data.accessToken);
        }) // nếu



    }

</script>

</body>
</html>
