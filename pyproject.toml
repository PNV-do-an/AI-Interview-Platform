[project]
name = "test-ai"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "google-genai>=2.18.1",
    "numpy>=2.5.2",
    "python-dotenv>=1.2.3",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "transformers>=5.15.0",
    "vieneu>=3.2.6",
]

[project.scripts]
test-ai = "test_ai:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
